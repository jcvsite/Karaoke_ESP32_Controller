<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 980" width="520" height="980" font-family="Figtree, Segoe UI, Arial, sans-serif">
  <!-- Karaoke Pad: a custom button remote for JCV Karaoke Pro.
       4x4 membrane keypad + 4 extra buttons + status LED on an ESP32. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d3d"/>
      <stop offset="1" stop-color="#0f131b"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4254"/>
      <stop offset="1" stop-color="#232937"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58c"/>
      <stop offset="1" stop-color="#c5a059"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="520" height="980" fill="#0b0e14"/>
  <rect x="60" y="30" width="400" height="920" rx="70" fill="url(#body)" stroke="#c5a059" stroke-opacity="0.45" stroke-width="2" filter="url(#sh)"/>

  <!-- Status LED + name -->
  <circle cx="260" cy="88" r="9" fill="#7ec8e3"/>
  <circle cx="260" cy="88" r="16" fill="#7ec8e3" opacity="0.18"/>
  <text x="260" y="134" text-anchor="middle" fill="#f3d58c" font-size="22" font-weight="800" letter-spacing="2">KARAOKE PAD</text>
  <text x="260" y="158" text-anchor="middle" fill="#8f99ab" font-size="13">Bluetooth · JCV Karaoke Pro</text>

  <!-- Top row: Melody / Mic (C / D) -->
  <g font-weight="800" text-anchor="middle">
    <rect x="100" y="185" width="150" height="56" rx="28" fill="url(#key)" stroke="#7ec8e3" stroke-opacity="0.6" filter="url(#sh)"/>
    <text x="175" y="219" fill="#7ec8e3" font-size="18">♪ MELODY</text>
    <text x="175" y="255" fill="#5d6678" font-size="11">keypad C</text>
    <rect x="270" y="185" width="150" height="56" rx="28" fill="url(#key)" stroke="#2ec4b6" stroke-opacity="0.6" filter="url(#sh)"/>
    <text x="345" y="219" fill="#2ec4b6" font-size="18">🎤 MIC</text>
    <text x="345" y="255" fill="#5d6678" font-size="11">keypad D</text>
  </g>

  <!-- Number keys 1-9, Back / 0 / OK -->
  <g font-weight="800" text-anchor="middle" font-size="34" fill="#f2f4f8">
    <g id="r1">
      <rect x="100" y="280" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="148" y="332">1</text>
      <rect x="212" y="280" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="260" y="332">2</text>
      <rect x="324" y="280" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="372" y="332">3</text>
    </g>
    <rect x="100" y="372" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="148" y="424">4</text>
    <rect x="212" y="372" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="260" y="424">5</text>
    <rect x="324" y="372" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="372" y="424">6</text>
    <rect x="100" y="464" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="148" y="516">7</text>
    <rect x="212" y="464" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="260" y="516">8</text>
    <rect x="324" y="464" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="372" y="516">9</text>
    <rect x="100" y="556" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="148" y="606" font-size="26">⌫</text>
    <rect x="212" y="556" width="96" height="78" rx="18" fill="url(#key)" filter="url(#sh)"/><text x="260" y="608">0</text>
    <rect x="324" y="556" width="96" height="78" rx="18" fill="url(#gold)" filter="url(#sh)"/><text x="372" y="606" font-size="24" fill="#14110a">OK</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5d6678">
    <text x="148" y="650">* Back</text><text x="372" y="650"># OK</text>
  </g>

  <!-- Next / Stop (A / B) -->
  <g font-weight="800" text-anchor="middle">
    <rect x="100" y="672" width="150" height="58" rx="18" fill="url(#gold)" filter="url(#sh)"/>
    <text x="175" y="708" fill="#14110a" font-size="18">⏭ NEXT</text>
    <rect x="270" y="672" width="150" height="58" rx="18" fill="#5a1f26" stroke="#e05a6a" stroke-opacity="0.7" filter="url(#sh)"/>
    <text x="345" y="708" fill="#ffb3bc" font-size="18">■ STOP</text>
    <text x="175" y="746" fill="#5d6678" font-size="11">keypad A</text>
    <text x="345" y="746" fill="#5d6678" font-size="11">keypad B</text>
  </g>

  <!-- Volume / Tempo rockers (extra buttons) -->
  <g font-weight="800" text-anchor="middle">
    <rect x="100" y="770" width="150" height="120" rx="40" fill="url(#key)" stroke="#c5a059" stroke-opacity="0.4" filter="url(#sh)"/>
    <text x="175" y="812" fill="#f3d58c" font-size="28">+</text>
    <text x="175" y="836" fill="#8f99ab" font-size="13">VOLUME</text>
    <text x="175" y="872" fill="#f3d58c" font-size="28">−</text>
    <rect x="270" y="770" width="150" height="120" rx="40" fill="url(#key)" stroke="#c5a059" stroke-opacity="0.4" filter="url(#sh)"/>
    <text x="345" y="812" fill="#f3d58c" font-size="28">+</text>
    <text x="345" y="836" fill="#8f99ab" font-size="13">TEMPO</text>
    <text x="345" y="872" fill="#f3d58c" font-size="28">−</text>
  </g>
  <text x="260" y="922" text-anchor="middle" fill="#5d6678" font-size="11">GPIO 23 / 22 vol · 21 / 19 tempo (hold to repeat)</text>
</svg>
