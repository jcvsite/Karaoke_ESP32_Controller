; JCV Karaoke Pro — ESP32 Bluetooth button pad (Room API, BLE controller).
; Build:   pio run
; Flash:   pio run -t upload
; Console: pio device monitor   (115200; type keys to press them — see README)

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -D CORE_DEBUG_LEVEL=0
